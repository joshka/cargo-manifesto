[package]
name = "cargo-manifesto"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
description = "A satirical Cargo subcommand that derives your project's timeless principles from the choices it already made"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/cargo-manifesto"
readme = "README.md"
keywords = ["cargo", "satire", "manifesto", "subcommand", "cli"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
include = ["/src", "/docs/origin.md", "/README.md", "/LICENSE-*", "/CHANGELOG.md"]

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
struct_excessive_bools = "allow"
format_push_string = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
indoc = "2"
