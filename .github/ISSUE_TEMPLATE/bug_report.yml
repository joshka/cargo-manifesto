name: Bug report
description: Report a wrong observation, a crash, or a manifesto that claims something untrue.
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest Cargo.toml (or project) and command that reproduce it.
      render: toml
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `cargo manifesto --version`, `cargo --version`, and your platform.
    validations:
      required: true
